name: Verify Apple app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: xcodebuild -project iVidiMahjong.xcodeproj -scheme iVidiMahjong-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - run: xcodebuild -project iVidiMahjong.xcodeproj -scheme iVidiMahjong-iOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
