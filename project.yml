name: iVidiMahjong
options:
  bundleIdPrefix: com.vidi
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: S769436W24
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  iVidiMahjong-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iVidiMahjong
    info:
      path: Generated/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: "iVidiMahjong"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividimahjong
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  iVidiMahjong-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: iVidiMahjong
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: "iVidiMahjong"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: "public.app-category.board-games"
        NSHumanReadableCopyright: "Copyright © 2026 David Arsénio Martins"
    entitlements:
      path: Generated/iVidiMahjong-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividimahjong
        PRODUCT_NAME: iVidiMahjong
        PRODUCT_MODULE_NAME: iVidiMahjong
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false

  iVidiMahjongTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: iVidiMahjongTests
    dependencies:
      - target: iVidiMahjong-macOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividimahjong.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iVidiMahjong.app/Contents/MacOS/iVidiMahjong"
        BUNDLE_LOADER: "$(TEST_HOST)"

  iVidiMahjongUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iVidiMahjongUITests
    dependencies:
      - target: iVidiMahjong-iOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividimahjong.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: iVidiMahjong-iOS

  iVidiMahjongMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: iVidiMahjongUITests
    dependencies:
      - target: iVidiMahjong-macOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.ividimahjong.macuitests
        TEST_TARGET_NAME: iVidiMahjong-macOS

schemes:
  iVidiMahjong-iOS:
    build:
      targets:
        iVidiMahjong-iOS: all
    test:
      targets:
        - iVidiMahjongUITests
  iVidiMahjong-macOS:
    build:
      targets:
        iVidiMahjong-macOS: all
    test:
      targets:
        - iVidiMahjongTests
        - iVidiMahjongMacUITests
