name: iVidiMahjong
options:
  bundleIdPrefix: com.vidi
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: S769436W24
targets:
  iVidiMahjong-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iVidiMahjong
    info:
      path: Generated/Info-iOS.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: "iVidiMahjong"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vidi.iMahjong
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  iVidiMahjong-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: iVidiMahjong
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: "iVidiMahjong"
        LSApplicationCategoryType: "public.app-category.puzzle-games"
        NSHumanReadableCopyright: "Copyright © 2026 David Arsénio Martins"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vidi.iMahjong
        PRODUCT_MODULE_NAME: iVidiMahjong
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false

  iVidiMahjongTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: iVidiMahjongTests
    dependencies:
      - target: iVidiMahjong-macOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iVidiMahjong-macOS.app/Contents/MacOS/iVidiMahjong-macOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
